version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: dev.dockerfile
    ports:
      - "5000:4321"
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/pnpm-lock.yaml
    
  frontend:
    build:
      context: ./frontend
      dockerfile: dev.dockerfile
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./frontend/app
          target: /app/app
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml